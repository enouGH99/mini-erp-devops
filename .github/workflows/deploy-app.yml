name: Continuous Deployment with Auto-Rollback

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Pre-deployment Cleanup
        run: |
          echo "Membersihkan image yang tidak terpakai untuk menghemat ruang disk Proxmox..."
          docker image prune -f

      - name: Build and Deploy
        id: deploy_step
        run: |
          echo "Memulai proses build image baru..."
          # Build image baru terlebih dahulu
          docker compose build
          
          echo "Menjalankan kontainer baru..."
          # Menggunakan --no-deps agar jika gagal, ia tidak merusak link ke kontainer lain
          docker compose up -d --build
          
      - name: Health Check (Verify Deployment)
        id: health_check
        run: |
          echo "Menunggu aplikasi startup (15 detik)..."
          sleep 15
          
          # Mengecek apakah kontainer berstatus 'Up' dan tidak restart terus-menerus
          if [ "$(docker inspect -f '{{.State.Running}}' frontend-kwhmeter)" == "true" ]; then
            echo "Aplikasi sehat dan berjalan!"
          else
            echo "Aplikasi GAGAL berjalan (CrashLoop). Memulai Rollback..."
            exit 1
          fi

      - name: Rollback on Failure
        if: failure()
        run: |
          echo "Mendeteksi kegagalan pada tahap sebelumnya. Melakukan Rollback..."
          # Di sini kita bisa memerintahkan docker untuk kembali ke versi image sebelumnya jika Anda menggunakan tagging
          # Untuk saat ini, kita pastikan setidaknya layanan lama atau layanan yang stabil tetap running
          docker compose up -d
          echo "Rollback selesai. Sila cek log aplikasi untuk penyebab error."
